<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06070c">
<title>횃불과 원소 — 2차 시제품</title>
<style>
:root{
  --bg:#06070c; --panel:rgba(16,18,30,.88); --panel2:rgba(28,31,50,.94); --line:rgba(255,255,255,.12);
  --text:#eef0f8; --dim:#9aa2bd; --hp:#ff5a6a;
  --fire:#ff8a2a; --ice:#8fdcff; --bolt:#ffe14a; --poison:#79e05a; --water:#4d97ff; --push:#f2e6c8;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;touch-action:none;overscroll-behavior:none;
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
button{font-family:inherit;color:inherit;cursor:pointer}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#hurt{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(255,30,50,.55));transition:opacity .35s}
#hurt.on{opacity:1;transition:none}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
#hud button{pointer-events:auto}
#top{padding:calc(8px + var(--st)) 12px 0}
.hprow{display:flex;gap:8px;align-items:center}
#hpbar{position:relative;flex:1;height:24px;border-radius:12px;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.2);overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.4)}
#hpghost{position:absolute;left:0;top:0;bottom:0;width:100%;background:#fff;opacity:.55;transition:width .6s .15s}
#hpfill{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(180deg,#ff8a95,#e0364a 60%,#b8243a);transition:width .18s}
#hptext{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:13px;text-shadow:0 1px 2px #000,0 0 3px #000}
.round{width:38px;height:38px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-weight:800;font-size:15px}
.subrow{display:flex;gap:8px;font-size:12px;color:var(--dim);margin-top:6px;align-items:center;flex-wrap:wrap}
#floorname{color:#d6dcff;font-weight:800}
.pill{display:inline-flex;align-items:center;gap:2px;padding:1px 7px;border-radius:9px;background:rgba(0,0,0,.55);border:1px solid var(--line);color:var(--text);font-size:11.5px}
#log{margin-top:6px;font-size:12.5px;line-height:1.5;max-width:80%;text-shadow:0 1px 2px #000,0 0 4px #000}
#log div{transition:opacity .6s}
#log div.old{opacity:.5}
#log .good{color:#9dffb5}#log .bad{color:#ff9aa4}#log .syn{color:#ffe38a;font-weight:700}#log .info{color:#b9c6ff}

#banner{position:fixed;left:0;right:0;top:24%;text-align:center;pointer-events:none;font-weight:900;font-size:28px;letter-spacing:.5px;opacity:0;
  text-shadow:0 3px 0 rgba(0,0,0,.55),0 0 18px currentColor}
#banner.show{animation:ban 1.15s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes ban{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.18)}25%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
#toast{position:fixed;left:50%;bottom:calc(252px + var(--sb));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}

#camctl{position:fixed;right:10px;bottom:calc(244px + var(--sb));display:flex;flex-direction:column;gap:8px;pointer-events:none}
#camctl button{pointer-events:auto;width:50px;height:50px;border-radius:15px;background:var(--panel);border:1px solid var(--line);font-size:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
#camctl small{font-size:9.5px;color:var(--dim);margin-top:3px}

#bottom{padding:0 10px calc(10px + var(--sb))}
#targetbar{display:none;align-items:center;gap:8px;margin-bottom:6px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 12px;font-size:13px;line-height:1.35;pointer-events:auto}
#targetbar.on{display:flex}
#targettext{flex:1}
#targettext b{color:#ffe38a}
#btn-cancel{flex:none;height:38px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:13px}
#skills{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px}
.sk{position:relative;height:60px;border-radius:15px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:23px;line-height:1;
  box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--c) 55%,transparent)}
.sk small{font-size:11px;color:var(--dim);margin-top:3px}
.sk .cd{position:absolute;inset:0;border-radius:15px;background:rgba(0,0,0,.66);display:none;place-items:center;font-size:20px;font-weight:900;color:#dfe3f5}
.sk.cooling .cd{display:grid}
.sk.sel{outline:2px solid var(--c);box-shadow:0 0 18px color-mix(in srgb,var(--c) 70%,transparent),inset 0 -3px 0 var(--c)}
#actions{display:grid;grid-template-columns:.9fr 1.15fr 1.2fr .95fr;gap:6px}
#actions button{position:relative;height:56px;border-radius:15px;background:var(--panel);border:1px solid var(--line);font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
#actions small{font-size:11px;color:var(--dim);margin-top:4px}
#btn-wait{background:linear-gradient(180deg,rgba(60,66,100,.95),rgba(30,34,56,.95))!important}
#bagcount{position:absolute;top:6px;right:10px;font-size:11px;font-weight:800;color:#ffe38a}
#btn-ctx.live{border-color:#ffd27a;box-shadow:0 0 14px rgba(255,200,90,.45)}
#btn-ctx:disabled{opacity:.35}

/* ---------- world labels ---------- */
.dmg{position:absolute;left:0;top:0;font-weight:900;font-size:21px;color:#fff;white-space:nowrap;will-change:transform,opacity;
  text-shadow:0 2px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000,0 0 8px rgba(0,0,0,.7)}
.dmg.big{font-size:27px}
.dmg.word{font-size:14px;letter-spacing:.3px}
.tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:2px;transform:translate(-50%,-100%);will-change:transform}
.tag .ico{font-size:15px;line-height:1;text-shadow:0 1px 2px #000;white-space:nowrap;font-weight:900}
.tag .ico.intent{font-size:17px;animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
.tag .hpb{width:34px;height:5px;border-radius:3px;background:rgba(0,0,0,.7);overflow:hidden;border:1px solid rgba(0,0,0,.8)}
.tag .hpb i{display:block;height:100%;background:#ff5a6a;transition:width .2s}

/* ---------- panels ---------- */
.hidden{display:none!important}
#info{position:fixed;left:12px;right:12px;bottom:calc(252px + var(--sb));max-height:52vh;overflow:auto;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.5;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#info h3{margin:0 0 4px;font-size:15px}
#info .hint{color:#ffe38a}
#info .row{display:flex;gap:8px;margin-top:10px}
#info .row button{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);font-size:14px;font-weight:700}
#info .row button.pri{background:linear-gradient(180deg,#4b6bd6,#3148a0);border-color:#6b8cff}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:62%;background:var(--panel2);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:14px 14px calc(14px + var(--sb));overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.6)}
#sheet h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
#sheet .close{height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.08)}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px;margin-bottom:6px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:14px}
.item .sw{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:17px;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.item .nm{flex:1}
.item .nm small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
.item .n{font-weight:900;color:#ffe38a}
#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 35%,rgba(40,44,80,.82),rgba(4,5,10,.96));padding:24px;z-index:5;pointer-events:auto}
#screen .box{max-width:420px;width:100%;text-align:center}
#screen h1{font-size:34px;margin:0 0 6px;letter-spacing:1px;background:linear-gradient(180deg,#ffe7a8,#ff9a3c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.5))}
#screen h2{font-size:26px;margin:0 0 8px}
#screen p{color:#c3c9e2;font-size:14px;line-height:1.6;margin:8px 0}
#screen .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0;text-align:left}
#screen .stats div{background:rgba(255,255,255,.06);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--dim)}
#screen .stats b{display:block;color:var(--text);font-size:18px}
.bigbtn{margin-top:14px;width:100%;height:56px;border-radius:16px;border:0;font-size:18px;font-weight:900;color:#1a1206;background:linear-gradient(180deg,#ffd77a,#ff9a3c);box-shadow:0 5px 0 #a4541b,0 10px 30px rgba(255,150,60,.35)}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #a4541b}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.chips span{font-size:12px;padding:4px 9px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
#help{position:fixed;inset:0;background:rgba(6,7,12,.94);z-index:6;overflow:auto;padding:calc(16px + var(--st)) 16px calc(24px + var(--sb));pointer-events:auto}
#help h2{margin:0 0 4px;font-size:20px}
#help h4{margin:18px 0 6px;font-size:14px;color:#ffe38a}
#help table{width:100%;border-collapse:collapse;font-size:13px}
#help td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45}
#help td:first-child{white-space:nowrap;font-weight:700}
#help .close{position:sticky;top:0;float:right;height:38px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2)}
#floorcard{position:fixed;left:0;right:0;top:15%;text-align:center;pointer-events:none;opacity:0;transition:opacity .5s}
#floorcard.on{opacity:1}
#floorcard .k{font-size:13px;color:#9fb0ff;letter-spacing:4px}
#floorcard .n{font-size:28px;font-weight:900;margin:4px 0;text-shadow:0 3px 0 #000,0 0 20px rgba(120,150,255,.5)}
#floorcard .t{display:inline-block;max-width:86%;font-size:13.5px;color:#ffe38a;background:rgba(0,0,0,.55);padding:6px 12px;border-radius:10px;line-height:1.5}
/* ---------- 2차: 영혼석 · 무기 ---------- */
#souls{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:6px}
.slot{position:relative;height:44px;border-radius:12px;background:rgba(10,10,18,.82);border:2px dashed rgba(255,255,255,.2);font-size:20px;display:grid;place-items:center;line-height:1;pointer-events:auto}
.slot.on{border-style:solid;border-color:var(--c);box-shadow:inset 0 0 14px color-mix(in srgb,var(--c) 45%,transparent),0 2px 0 rgba(0,0,0,.4)}
.slot .scd{position:absolute;inset:0;border-radius:10px;background:rgba(0,0,0,.62);display:none;place-items:center;font-size:13px;font-weight:900;color:#e8d8ff}
.slot.cool .scd{display:grid}
.slot.flash{animation:sflash .7s ease-out}
@keyframes sflash{0%{transform:scale(1.4) translateY(-6px);box-shadow:0 0 30px var(--c),inset 0 0 22px var(--c);background:color-mix(in srgb,var(--c) 65%,#000)}100%{transform:scale(1)}}
.gpop{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#1c1628;border:5px solid var(--c);box-shadow:0 0 18px var(--c),0 3px 0 #000;font-size:21px}
.dmg.gem{text-shadow:none}
body.slowmo #stage{filter:saturate(1.4) contrast(1.1) brightness(1.08)}
body.slowmo #banner{font-size:34px}
.tag .wk{font-size:13px;margin:0 1px;filter:drop-shadow(0 0 3px #ffe14a)}
.tag .fin{font-size:14px;margin:0 1px;text-shadow:0 0 6px currentColor,0 1px 2px #000}
#btn-wpn{font-size:18px!important}
#btn-wpn small{white-space:nowrap}
.sec{font-size:13px;font-weight:800;margin:12px 0 6px;color:#ffe38a}
.sec small{color:var(--dim);font-weight:400;margin-left:6px}
.gems{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.gch{height:58px;border-radius:12px;border:2px solid var(--c,rgba(255,255,255,.2));background:rgba(0,0,0,.35);font-size:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.gch small{font-size:9.5px;color:var(--dim);white-space:nowrap}
.gch.empty{border-style:dashed;opacity:.5}
.gch.sel{box-shadow:0 0 16px var(--c);transform:scale(1.07)}
.gch.ok{animation:okp .7s infinite alternate}
@keyframes okp{to{box-shadow:0 0 16px var(--c);transform:scale(1.05)}}
.gline{margin-top:8px;font-size:12.5px;color:#d8dcf0;min-height:18px}
.wrow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.wbtn{height:54px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.wbtn.on{border-color:#ffd27a;box-shadow:0 0 12px rgba(255,200,90,.35)}
.gtxt{font-size:12.5px;line-height:1.6}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

} }
</script>

<body>
<div id="stage"></div>
<div id="hurt"></div>
<div id="labels"></div>
<div id="hud">
  <div id="top">
    <div class="hprow">
      <div id="hpbar"><div id="hpghost"></div><div id="hpfill"></div><span id="hptext">30 / 30</span></div>
      <button id="btn-sound" class="round" title="소리">🔊</button>
      <button id="btn-help" class="round" title="도감">?</button>
    </div>
    <div class="subrow"><span id="floorname">B1</span><span id="turns">턴 0</span><span id="pstatus"></span></div>
    <div id="log"></div>
  </div>
  <div id="bottom">
    <div id="targetbar"><span id="targettext"></span><button id="btn-cancel">✕ 취소</button></div>
    <div id="souls"></div>
    <div id="skills"></div>
    <div id="actions">
      <button id="btn-bag">🎒<small>가방</small><b id="bagcount"></b></button>
      <button id="btn-wpn">⚔<small>무기</small></button>
      <button id="btn-wait">⏳<small>대기 · 길게 누르면 휴식</small></button>
      <button id="btn-ctx" disabled>·<small>—</small></button>
    </div>
  </div>
</div>
<div id="camctl">
  <button id="btn-tilt">◢<small>기울기</small></button>
  <button id="btn-home">⌂<small>탑뷰</small></button>
</div>
<div id="banner"></div>
<div id="toast"></div>
<div id="floorcard"><div class="k"></div><div class="n"></div><div class="t"></div></div>
<div id="info" class="hidden"></div>
<div id="sheet" class="hidden"></div>
<div id="help" class="hidden"></div>
<div id="screen"></div>
<!-- =====================================================================
  DioramaKit — 카메라 · 조명 · 셰이더 · 격자 렌더링 · 이펙트
  게임 규칙을 전혀 모른다. 정착지(밝은 미니어처 마을)에서도 이 블록을 그대로 쓴다.
  createDiorama(container, { preset: 'dungeon' | 'settlement' })
====================================================================== -->
<script type="module" id="diorama-kit">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const SHARED = { uTime: { value: 0 } };
const SURF = { NONE: 0, WATER: 1, GRASS: 2, OIL: 3, ICE: 4, ASH: 5 };
const CLOUD = { NONE: 0, STEAM: 1, SMOKE: 2 };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v = new THREE.Vector3(), _s = new THREE.Vector3(), _c = new THREE.Color();

/* ---------------- 재질: 툰 3단 + 매끈한 플라스틱 하이라이트 ---------------- */
const GRADIENT = (() => {
  const t = new THREE.DataTexture(new Uint8Array([70, 70, 70, 255, 160, 160, 160, 255, 255, 255, 255, 255]), 3, 1);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true; return t;
})();
const BAYER = `float bayer4(vec2 p){ ivec2 q = ivec2(mod(floor(p), 4.0)); int k = q.x + q.y * 4;
  float m[16] = float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.); return (m[k] + 0.5) / 16.0; }`;

function toon(o = {}) {
  const { color = 0xffffff, gloss = 0.5, vertexColors = false, fade = false, sway = false,
    emissive = 0x000000, transparent = false, opacity = 1 } = o;
  const m = new THREE.MeshToonMaterial({ color, gradientMap: GRADIENT, vertexColors, emissive, transparent, opacity });
  m.userData.gloss = { value: gloss };
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uGloss = m.userData.gloss; sh.uniforms.uTime = SHARED.uTime;
    let vs = sh.vertexShader, fs = sh.fragmentShader;
    vs = vs.replace('#include <common>', `#include <common>
uniform float uTime;
${fade ? 'attribute float aFade; varying float vFade;' : ''}`);
    let bv = '#include <begin_vertex>\n';
    if (fade) bv += 'vFade = aFade;\n';
    if (sway) bv += `
#ifdef USE_INSTANCING
float ph = instanceMatrix[3].x * 1.7 + instanceMatrix[3].z * 1.3;
#else
float ph = 0.0;
#endif
transformed.x += sin(uTime * 2.1 + ph) * 0.45 * position.y * position.y;
transformed.z += cos(uTime * 1.6 + ph * 1.3) * 0.32 * position.y * position.y;
`;
    vs = vs.replace('#include <begin_vertex>', bv);
    fs = fs.replace('#include <common>', `#include <common>
uniform float uGloss;
${fade ? 'varying float vFade;\n' + BAYER : ''}`);
    if (fade) fs = fs.replace('void main() {', 'void main() {\n  if (vFade > 0.01 && bayer4(gl_FragCoord.xy) < vFade) discard;');
    fs = fs.replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
{
  vec3 Lc = min(reflectedLight.directDiffuse / max(diffuseColor.rgb, vec3(0.12)), vec3(1.6));
  vec3 Vd = normalize(vViewPosition);
  vec3 Hd = normalize(Vd + vec3(-0.3, 0.75, 0.2));
  float sp = pow(max(dot(normal, Hd), 0.0), 60.0);
  float rim = 1.0 - max(dot(normal, Vd), 0.0);
  totalEmissiveRadiance += uGloss * Lc * (smoothstep(0.3, 0.45, sp) * 1.6 + smoothstep(0.62, 0.95, rim) * 0.4);
}`);
    sh.vertexShader = vs; sh.fragmentShader = fs;
  };
  m.customProgramCacheKey = () => `dk-toon-${fade ? 1 : 0}${sway ? 1 : 0}`;
  return m;
}

function outlineMaterial(o = {}) {
  const { width = 0.03, color = 0x120e18, fade = false } = o;
  return new THREE.ShaderMaterial({
    uniforms: { uW: { value: width }, uC: { value: new THREE.Color(color) } },
    vertexShader: `uniform float uW;
${fade ? 'attribute float aFade; varying float vFade;' : ''}
void main() {
  ${fade ? 'vFade = aFade;' : ''}

    }

  clear() { this.items.forEach((i) => i.el.remove()); this.items.length = 0; }
}

function enemyMelee(e, t) {

function chargePath(e, dx, dy) {

/* ================= 환경 틱: 불 번짐 · 구름 · 상태 ================= */
function envTick() {
  const W = G.W, N = W * G.H, spread = new Set(), oilIgn = [];
  for (let i = 0; i < N; i++) if (G.fire[i] > 0) {
    const [x, y] = XY(i);
    for (const [dx, dy] of D4) { const nx = x + dx, ny = y + dy; if (!inb(nx, ny)) continue; const j = I(nx, ny); if (G.fire[j]) continue; if (G.surf[j] === S_GRASS) spread.add(j); else if (G.surf[j] === S_OIL) oilIgn.push(j); }
  }
  let changed = false;
  for (let i = 0; i < N; i++) if (G.fire[i] > 0) { G.fire[i]--; changed = true; if (!G.fire[i] && G.surf[i] === S_GRASS) G.surf[i] = S_ASH; }
  for (const j of spread) { G.fire[j] = 3; const [x, y] = XY(j); emit('ignite', { x, y, small: true }); }
  if (spread.size && [...spread].some((j) => G.vis[j])) log('불길이 풀밭을 타고 번진다', 'info');
  for (let i = 0; i < N; i++) if (G.cloudT[i] > 0) { G.cloudT[i]--; if (!G.cloudT[i]) G.cloud[i] = 0; changed = true; }
  if (changed || spread.size) snapTerrain();
  for (const j of oilIgn) if (G.surf[j] === S_OIL) oilBlast(...XY(j));
  for (const e of G.ents) {
    if (!e.alive) continue; const i = I(e.x, e.y);
    if (G.fire[i] > 0) applyFire(e, 2);
    if (e.alive && G.cloud[i] === C_STEAM) { damage(e, 1, 'steam'); if (e.alive && e.st.wet < 2) { e.st.wet = 2; emitStatus(e); } }
  }
  for (const e of G.ents) {
    if (!e.alive) continue;
    const st = e.st, i = I(e.x, e.y), before = JSON.stringify(st);
    if (st.burn > 0) { if (G.surf[i] === S_WATER) st.burn = 0; else { damage(e, 1, 'burn'); st.burn--; } }
    if (e.alive && st.poison > 0) { damage(e, 1, 'poison'); st.poison--; }
    if (e.alive && st.bleed > 0) { damage(e, 1, 'bleed'); st.bleed--; }
    if (st.frac > 0) st.frac--;
    if (G.surf[i] === S_WATER) st.wet = 3; else if (st.wet > 0) st.wet--;
    if (st.haste > 0) st.haste--; if (st.immune > 0) st.immune--;
    if (e.alive && JSON.stringify(st) !== before) emitStatus(e);
  }
}

/* ================= 턴 ================= */
function endTurn() {

  G.hasteFlip = false;

}
function worldTick() {
  G.stats.turns++;
  computeFOV(); snapVis();
  const p = G.player;
  G.tickMoveEnd = TL.cur + 110;
  const dm = distMap(p.x, p.y);
  for (const a of G.ents.filter((e) => e.alive && e.ally)) if (a.alive && !G.over) allyAct(a);
  const foes = G.ents.filter((e) => e.alive && isFoe(e)).sort((a, b) => cheb(a.x, a.y, p.x, p.y) - cheb(b.x, b.y, p.x, p.y));
  for (const e of foes) { if (G.over) break; if (e.alive) { G.curSrc = e; withCtx('enemy', () => enemyAct(e, dm)); G.curSrc = null; } }
  if (!G.over) envTick();
  for (const k in G.cd) if (G.cd[k] > 0) G.cd[k]--;
  for (const sl of G.slots) if (sl.cd > 0) sl.cd--;
  if (p.alive && G.stats.turns % 6 === 0 && p.hp < p.max && !p.st.poison && !p.st.burn) { p.hp++; emit('hp', { id: 0, hp: p.hp, max: p.max }); }

/* ================= 주인공 행동 ================= */
function playerMove(dx, dy) {
  const p = G.player, nx = p.x + dx, ny = p.y + dy;
  if (!inb(nx, ny)) return false;
  const t = G.tile[I(nx, ny)];
  if (t === T_WALL) return false;
  const e = entAt(nx, ny);
  if (e) { if (e.ally) { moveEnt(e, p.x, p.y); stepEnt(p, dx, dy); return true; } playerMelee(e); return true; }
  if (t === T_DOOR) { p.face = [dx, dy]; emit('face', { id: 0, dx, dy }); openDoor(nx, ny); log('문을 열었다', 'info'); return true; }
  stepEnt(p, dx, dy);
  return true;
}
function playerMelee(t) { withCtx('hit', (ctx) => weaponHit(t, ctx)); }
function playerWait() { emit('lunge', { id: 0, dx: 0, dy: 0, amt: 0 }); withCtx('wait', (ctx) => trigger('purple', {}, ctx)); return true; }

/* ---------- 무기 공격: 형태 → 부상, 약점, 빨강 발동 ---------- */
function weaponHit(t, ctx, o = {}) {
  if (!t || !t.alive) return;
  const p = G.player, w = WEAPONS[G.wpn[G.wi]], f = w.form, dx = sgn(t.x - p.x), dy = sgn(t.y - p.y);
  if (dx || dy) p.face = [dx, dy];
  emit('swing', { id: 0, dx, dy, form: f, tx: t.x, ty: t.y, extra: !!o.extra, counter: !!o.counter });
  TL.wait(o.extra ? 60 : 80);
  const cat = catOf(t), C = CATS[cat], weak = C.weak === f;
  let dmg = ri(w.dmg[0], w.dmg[1]), label = o.counter ? '반격' : o.extra ? '추가 타격' : '', crit = false;
  if (weak) {

    if (!G.weakKnown[cat]) { G.weakKnown[cat] = true; emit('weakReveal', { id: t.id, form: f }); log(`약점 발견 — ${C.name}은(는) ${FORMS[f].name}에 약하다!`, 'syn'); }
    label = label || '약점!';
  }

  damage(t, dmg, 'hit', { dx, dy, label, big: crit || weak, form: f, crit });

    if (f === 'blunt') { t.st.frac = Math.max(t.st.frac, weak ? 5 : 3); if (t.charge) { t.charge = null; log(`${t.name}의 다리가 부러져 돌진이 끊겼다`, 'good'); } }

/* ---------- 영혼석: 발동 · 연쇄 단계 ---------- */
function withCtx(origin, fn) {
  const prev = G.ctx, ctx = { origin, stage: 0, stones: 0, fired: new Set(), slow: false };
  G.ctx = ctx;
  try { fn(ctx); } finally { G.ctx = prev; }
  if (ctx.stage > 0) emit('chainEnd', { stage: ctx.stage });
  if (ctx.stage > G.stats.best) G.stats.best = ctx.stage;
  return ctx;
}
function bumpStage(ctx) {
  ctx.stage++;
  emit('chainStage', { stage: ctx.stage });
  if (ctx.stage >= 3 && !ctx.slow) { ctx.slow = true; G.stats.chains++; emit('slowmo', { stage: ctx.stage }); }
}
function emitSlots() { emit('slots', { slots: G.slots.map((q) => ({ ...q })), bag: G.sbag.slice() }); }
function trigger(color, info, ctx) {
  for (let s = 0; s < 6; s++) {
    if (!G.player.alive) return;
    const sl = G.slots[s], id = sl.stone;
    if (!id || STONE[id].color !== color || sl.cd > 0 || ctx.fired.has(s) || !stoneReady(id, info)) continue;
    if (color === 'green' && sl.gTurn === G.stats.turns) continue;
    ctx.fired.add(s); ctx.stones++;
    if (color === 'green') sl.gTurn = G.stats.turns;
    bumpStage(ctx);
    emit('stone', { slot: s, id, stage: ctx.stage });
    TL.wait(120);
    const prev = G.ctx; G.ctx = ctx;
    runStone(id, info, ctx);
    G.ctx = prev;
    if (color === 'purple') { sl.cd = 2; emitSlots(); }
    TL.wait(50);
  }
}
const nearFoes = (r) => G.ents.filter((e) => e.alive && isFoe(e) && G.vis[I(e.x, e.y)] && cheb(e.x, e.y, G.player.x, G.player.y) <= r);
function nearestFoe(except) {
  let best = null, bd = 99;
  for (const e of G.ents) { if (!e.alive || !isFoe(e) || e === except || !G.vis[I(e.x, e.y)]) continue; const d = cheb(e.x, e.y, G.player.x, G.player.y); if (d < bd) { bd = d; best = e; } }
  return best;
}
const dirFrom = (a, b) => [sgn(b.x - a.x), sgn(b.y - a.y)];
function stoneReady(id, info) {
  const t = info.target, s = info.src, p = G.player, alive = (u) => !!(u && u.alive);
  switch (id) {
    case 'r_bleed': return alive(t) && !CATS[catOf(t)].noBleed;
    case 'r_extra': return alive(t) && t.st.bleed > 0;
    case 'r_freeze': return alive(t) && t.st.wet > 0;
    case 'r_arrow': return !!nearestFoe(t);
    case 'r_poison': case 'r_push': case 'r_shock': case 'r_fire': return alive(t);
    case 'p_summon': return G.ents.filter((e) => e.alive && e.ally).length < 2 && nearFoes(7).length > 0;
    case 'p_shield': case 'g_shield': return p.shield < 8;
    case 'p_heal': case 'g_heal': return p.hp < p.max;
    case 'p_poison': case 'p_push': return nearFoes(1).length > 0;
    case 'p_wet': return nearFoes(2).length > 0;
    case 'p_shock': return nearFoes(7).some((e) => e.st.wet > 0 || G.surf[I(e.x, e.y)] === S_WATER);
    case 'p_fire': return nearFoes(6).length > 0;

    default: return alive(s);
  }
}
function runStone(id, info, ctx) {

  switch (id) {
    case 'r_bleed': t.st.bleed += 3; emitStatus(t); break;
    case 'r_extra': weaponHit(t, ctx, { extra: true }); break;
    case 'r_poison': poisonOn(t, 3); break;
    case 'r_push': push(t, ...dirFrom(p, t), 1); break;
    case 'r_arrow': boneArrow(nearestFoe(t), 2); break;
    case 'r_shock': zapOn(t, 2); break;
    case 'r_fire': fireAt(t.x, t.y, 2); break;
    case 'r_freeze': freezeUnit(t, 3); break;
    case 'p_summon': summon(); break;
    case 'p_shield': addShield(4); break;
    case 'p_poison': for (const e of nearFoes(1)) poisonOn(e, 3); break;
    case 'p_push': for (const e of nearFoes(1)) if (e.alive) push(e, ...dirFrom(p, e), 1); break;
    case 'p_heal': heal(p, 3); break;
    case 'p_shock': { const hs = new Set(); for (const e of nearFoes(7)) if (e.alive && !hs.has(e.id) && (e.st.wet > 0 || G.surf[I(e.x, e.y)] === S_WATER)) zapOn(e, 3, hs); break; }
    case 'p_fire': { const e = nearestFoe(null); if (e) { const dur = 90 + cheb(p.x, p.y, e.x, e.y) * 45; emit('proj', { kind: 'fire', from: [p.x, p.y], to: [e.x, e.y], dur }); TL.wait(dur); fireAt(e.x, e.y, 3); } break; }
    case 'p_wet': for (const e of nearFoes(2)) { e.st.wet = Math.max(e.st.wet, 3); e.st.burn = 0; emitStatus(e); emit('splash', { x: e.x, y: e.y }); } break;
    case 'g_counter': weaponHit(s, ctx, { counter: true }); break;
    case 'g_shield': addShield(2); break;
    case 'g_poison': poisonOn(s, 3); break;
    case 'g_push': push(s, ...dirFrom(p, s), 2); break;
    case 'g_heal': heal(p, 2); break;
    case 'g_shock': zapOn(s, 3); break;
    case 'g_fire': fireAt(s.x, s.y, 2); break;
    case 'g_freeze': freezeUnit(s, s.st.wet > 0 ? 5 : 2); break;
    default: break;
  }
}
function poisonOn(e, n) { if (!e || !e.alive || e.st.immune) return; e.st.poison = Math.max(e.st.poison, n); emitStatus(e); emit('splat', { x: e.x, y: e.y }); }
function zapOn(e, dmg, hitSet) {
  if (!e || !e.alive) return;

  if (e.st.wet > 0 || G.surf[I(e.x, e.y)] === S_WATER) shock(e.x, e.y, dmg, { hitSet }); else { hitSet?.add(e.id); damage(e, dmg, 'shock'); }
}

}
function addStone(id) {
  const sl = G.slots.find((q) => !q.stone);
  if (sl) { sl.stone = id; sl.color = STONE[id].color; G.stats.stones++; log(`영혼석 「${STONE[id].icon} ${STONE[id].name}」 장착 — ${STONE[id].line}`, 'syn'); return true; }
  if (G.sbag.length < 3) { G.sbag.push(id); G.stats.stones++; log(`영혼석 「${STONE[id].icon} ${STONE[id].name}」 → 가방 (같은 색 칸과 교체 가능)`, 'good'); return true; }
  return false;
}
function summon() {
  const p = G.player; let spot = null;

  if (!spot) return;

function visibleFoes() { return G.ents.filter((e) => e.alive && isFoe(e) && G.vis[I(e.x, e.y)]); }

    if (!dx && !dy) continue;

    const li = I(cx, cy); if (G.surf[li] === S_WATER) note += ' · 물에 빠져 젖는다'; if (G.fire[li]) note += ' · 불 속으로!';

    else if (c?.st.poison) { note = '→ 독 폭발! 주변 8칸 3 피해, 중독된 적은 연쇄'; for (const [dx, dy] of D8) add(x + dx, y + dy, HEX.poison, 0, 0.6); if (cheb(x, y, p.x, p.y) <= 1) warn = ' ⚠ 나도 휘말린다!'; }

}
