<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>먹선 토르소 · 레이어 실험</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#191b1e;color:#e4ddcf;font:16px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px}h1{font-size:24px}p{color:#bcb7ae;line-height:1.6}.layout{display:grid;grid-template-columns:1fr 320px;gap:24px}.stage{background:#343534;border:1px solid #56534d;border-radius:12px;padding:16px}#large{display:block;width:100%;max-width:512px;margin:auto}canvas{max-width:100%}.controls{background:#25272a;padding:20px;border-radius:12px}label{display:block;margin:14px 0}select,button{padding:8px;background:#393b40;color:#eee;border:1px solid #666;border-radius:5px}input[type=range]{width:100%}.small{display:flex;gap:26px;align-items:end;flex-wrap:wrap;margin-top:24px}figure{margin:0;text-align:center}figcaption{font-size:12px;color:#bab4a8;margin-top:8px}a{color:#c9b88b}#error{color:#f7aaa0}@media(max-width:750px){.layout{grid-template-columns:1fr}}
</style><main>
<h1>먹선 토르소 · 인간 레이어 실험</h1>
<p>기본복과 갑옷 몸통을 교체하고, 동일한 머리·검·방패를 겹칩니다. 위치와 크기를 조절해 조합을 확인할 수 있습니다.</p>
<div class="layout"><section class="stage"><canvas id="large" width="512" height="512"></canvas>
<div class="small"><figure><canvas id="s48" width="48" height="48"></canvas><figcaption>48px</figcaption></figure><figure><canvas id="s64" width="64" height="64"></canvas><figcaption>64px</figcaption></figure><figure><canvas id="s96" width="96" height="96"></canvas><figcaption>96px</figcaption></figure></div></section>
<section class="controls">
<label>몸통 <select id="body"><option value="cloth">기본복</option><option value="armor" selected>철갑옷</option></select></label>
<label><input type="checkbox" id="head" checked> 머리</label>
<label><input type="checkbox" id="sword" checked> 검 + 잡은 손</label>
<label><input type="checkbox" id="shield" checked> 방패</label>
<label><input type="checkbox" id="floor" checked> 실제 타일 배경</label>
<hr><label>조정할 파츠 <select id="part"><option value="head">머리</option><option value="cloth">기본복</option><option value="armor">갑옷</option><option value="sword">검</option><option value="shield">방패</option></select></label>
<label>좌우 <output id="xv"></output><input id="x" type="range" min="-40" max="240" step="1"></label>
<label>상하 <output id="yv"></output><input id="y" type="range" min="-40" max="240" step="1"></label>
<label>크기 <output id="sv"></output><input id="scale" type="range" min="0.5" max="1.5" step="0.01" value="1"></label>
<button id="reset">위치 초기화</button> <button id="save">배치 JSON 저장</button>
<p>갑옷은 몸통 교체 파츠입니다. 검에는 손이 포함되어 있으며, 이 파일에서 게임 본편은 변경하지 않습니다.</p>
</section></div><p id="error" role="alert"></p>
<p><a href="../../assets/characters/ink-torso-v1/parts-readable-v2.png">원본 투명 파츠 시트</a> · <a href="ink-torso-readable-v2-prompts.json">생성 프롬프트</a></p></main>
<script>
const original={"canvas":[256,256],"order":["body","head","sword","shield"],"parts":{"cloth":{"source":[405,220,430,390],"destination":[49,100,154,131]},"armor":{"source":[837,220,417,390],"destination":[52,98,154,131]},"head":{"source":[40,80,350,530],"destination":[73,-4,110,167]},"sword":{"source":[40,642,327,561],"destination":[20,66,91,156]},"shield":{"source":[451,700,353,465],"destination":[164,127,77,102]}}};
let data=structuredClone(original);
const $=id=>document.getElementById(id);
const atlas=new Image(),tile=new Image();
let atlasReady=false,tileReady=false;
atlas.onload=()=>{atlasReady=true;draw()};
tile.onload=()=>{tileReady=true;draw()};
atlas.onerror=()=>{$("error").textContent="파츠 이미지를 읽지 못했습니다. 프로젝트 안에서 미리보기 파일을 열어 주세요."};
tile.onerror=()=>{$("error").textContent="타일 이미지를 읽지 못해 단색 배경으로 표시합니다."};
atlas.src="../../assets/characters/ink-torso-v1/parts-readable-v2.png";
tile.src="../../assets/topdown/floor1-ink-v2/materials-soft-v3.png";
function paint(canvas){
 const ctx=canvas.getContext("2d");ctx.clearRect(0,0,canvas.width,canvas.height);ctx.save();ctx.scale(canvas.width/256,canvas.height/256);
 ctx.fillStyle="#595650";ctx.fillRect(0,0,256,256);
 if($("floor").checked&&tileReady)ctx.drawImage(tile,0,0,tile.width/4,tile.height/4,0,0,256,256);
 if(atlasReady)for(const id of [$("body").value,"head","sword","shield"]){
  if(["head","sword","shield"].includes(id)&&!$(id).checked)continue;
  const p=data.parts[id];ctx.drawImage(atlas,...p.source,...p.destination);
 }
 ctx.restore();
}
function draw(){["large","s48","s64","s96"].forEach(id=>paint($(id)))}
function sync(){
 const id=$("part").value,p=data.parts[id].destination;
 $("x").value=p[0];$("y").value=p[1];$("scale").value=p[2]/original.parts[id].destination[2];
 $("xv").value=p[0];$("yv").value=p[1];$("sv").value=Number($("scale").value).toFixed(2);
}
for(const id of ["body","head","sword","shield","floor"])$(id).addEventListener("change",draw);
$("part").addEventListener("change",sync);
for(const id of ["x","y","scale"])$(id).addEventListener("input",()=>{
 const key=$("part").value,p=data.parts[key].destination,b=original.parts[key].destination,s=Number($("scale").value);
 p[0]=Number($("x").value);p[1]=Number($("y").value);p[2]=b[2]*s;p[3]=b[3]*s;sync();draw();
});
$("reset").onclick=()=>{data=structuredClone(original);sync();draw()};
$("save").onclick=()=>{
 const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
 const a=document.createElement("a");a.href=url;a.download="catalog.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
sync();draw();
</script></html>
