name: Test and deploy expedition
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  GODOT_VERSION: 4.6.2
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 6 --retry-all-errors --retry-delay 10 --connect-timeout 30 --max-time 300 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install "/tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -L --fail --retry 6 --retry-all-errors --retry-delay 10 --connect-timeout 30 --max-time 300 -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Import and verify
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import --quit 2>&1 | tee /tmp/import.log
          ! grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/import.log
          for suite in layout_guard start_kit run_start camping floor_descent boss_floor integration playthrough ui_smoke mobile_actions enemy_turns companion_tactics abilities_growth character_ui continuous_floor mobile_exploration curios monster_roles solo_floor solo_balance mobile_hud equipped_inventory party_swap_portraits floor_templates encounter_builder floor_generator encounter_sim skill_archetypes skill_rule_conditions test_loadout protect parts autobattle battle_presentation companion_intent_ui stances arena_mode utility npc_roster npc_sense npc_behaviour npc_hostility npc_progression npc_essences recruit combat_basics model_b_combat model_b_scheduler model_b_parts_ui model_b_spells model_b_runner spellbooks consumables essences stats_resist tag_sets essence_spells variants caster_species essence_ui stat_sheet_ui banners inspect_ui; do
            godot --headless --path . --script "res://tests/${suite}.gd" 2>&1 | tee "/tmp/${suite}.log"
            ! grep -E 'SCRIPT ERROR:|^ERROR:' "/tmp/${suite}.log"
          done
      - name: Export and verify packed runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee /tmp/export.log
          ! grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/export.log
          cp assets/fonts/NanumSquareR.LICENSE.txt build/web/
          cp assets/fonts/Galmuri11.LICENSE.txt build/web/
          touch build/web/.nojekyll
          pack_check_dir="$(mktemp -d)"
          cd "$pack_check_dir"
          godot --headless --main-pack "$GITHUB_WORKSPACE/build/web/index.pck" --quit-after 5 2>&1 | tee /tmp/pack.log
          ! grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/pack.log
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
