name: Test and deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.2
  XDG_CONFIG_HOME: /tmp/godot-config
  XDG_DATA_HOME: /tmp/godot-data
  XDG_CACHE_HOME: /tmp/godot-cache

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download Godot and Web templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --output godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          curl -L --fail --retry 3 --output templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          mkdir -p "${XDG_DATA_HOME}/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "${XDG_DATA_HOME}/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import project and validate scripts
        run: ./godot --headless --path . --editor --quit

      - name: Run headless tests
        run: ./godot --headless --path . --script res://tests/run_tests.gd

      - name: Run Party detail touch-scroll smoke
        run: ./godot --headless --path . --script res://tests/party_detail_scroll_smoke.gd

      - name: Run Party UI layout smoke
        run: ./godot --headless --path . --script res://tests/party_ui_layout_smoke.gd

      - name: Run Party UI visual style smoke
        run: ./godot --headless --path . --script res://tests/party_ui_visual_style_smoke.gd

      - name: Run Party product zoom smoke
        run: ./godot --headless --path . --script res://tests/party_product_zoom_smoke.gd

      - name: Inject Pages build ID
        shell: bash
        run: |
          set -euo pipefail
          build_id="${GITHUB_SHA:0:7}"
          if [[ ! "${build_id}" =~ ^[0-9a-f]{7}$ ]]; then
            echo "GitHub SHA did not produce a safe seven-character build ID" >&2
            exit 1
          fi
          sed -i "s/^const BUILD_ID := \"LOCAL\"$/const BUILD_ID := \"${build_id}\"/" playtest/build_info.gd
          grep -Fqx "const BUILD_ID := \"${build_id}\"" playtest/build_info.gd
          ./godot --headless --path . --editor --quit

      - name: Export Web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          ./godot --headless --path . --export-release Web build/web/index.html
          touch build/web/.nojekyll
          cp assets/fonts/NanumSquareR.LICENSE.txt build/web/
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          test -s build/web/NanumSquareR.LICENSE.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
