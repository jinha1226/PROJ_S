name: Test and deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.2
  XDG_CONFIG_HOME: /tmp/godot-config
  XDG_DATA_HOME: /tmp/godot-data
  XDG_CACHE_HOME: /tmp/godot-cache

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download Godot and Web templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --output godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          curl -L --fail --retry 3 --output templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          mkdir -p "${XDG_DATA_HOME}/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "${XDG_DATA_HOME}/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import project and validate scripts
        run: ./godot --headless --path . --editor --quit

      - name: Verify field turns and companion decisions
        run: |
          ./godot --headless --path . --script tests/field_turn_acceptance.gd
          ./godot --headless --path . --script tests/field_speed_acceptance.gd
          ./godot --headless --path . --script tests/field_lifecycle_acceptance.gd
          ./godot --headless --path . --script tests/field_party_control_acceptance.gd
          ./godot --headless --path . --script tests/solo_start_acceptance.gd
          ./godot --headless --path . --script tests/attack_button_acceptance.gd
          ./godot --headless --path . --script tests/solo_gameplay_acceptance.gd
          ./godot --headless --path . --script tests/solo_gameplay_acceptance.gd -- --legacy-input
          ./godot --headless --path . --script tests/feedback_and_routing_acceptance.gd
          ./godot --headless --path . --script tests/eight_way_visual_acceptance.gd
          ./godot --headless --path . --script tests/town_resident_motion_acceptance.gd
          ./godot --headless --path . --script tests/portrait_skills_acceptance.gd
          ./godot --headless --path . --script tests/input_recovery_acceptance.gd
          ./godot --headless --path . --script tests/waterside_render_acceptance.gd
          ./godot --headless --path . --script tests/field_turn_ui_acceptance.gd
          ./godot --headless --path . --script tests/run_party_ai_tests.gd

      - name: Verify environment reactions, replay, and body damage
        run: |
          ./godot --headless --path . --script tests/run_environment_regression_tests.gd
          ./godot --headless --path . --script tests/fireball_environment_acceptance.gd
          ./godot --headless --path . --script tests/environment_vfx_acceptance.gd
          ./godot --headless --path . --script tests/environment_tools_acceptance.gd

      - name: Inject Pages build ID
        shell: bash
        run: |
          set -euo pipefail
          build_id="${GITHUB_SHA:0:7}"
          if [[ ! "${build_id}" =~ ^[0-9a-f]{7}$ ]]; then
            echo "GitHub SHA did not produce a safe seven-character build ID" >&2
            exit 1
          fi
          sed -i "s/^const BUILD_ID := \"LOCAL\"$/const BUILD_ID := \"${build_id}\"/" playtest/build_info.gd
          grep -Fqx "const BUILD_ID := \"${build_id}\"" playtest/build_info.gd
          ./godot --headless --path . --editor --quit

      - name: Export Web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          ./godot --headless --path . --export-release Web build/web/index.html
          touch build/web/.nojekyll
          cp assets/fonts/NanumSquareR.LICENSE.txt build/web/
          cp assets/fonts/Galmuri-OFL.txt build/web/
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          test -s build/web/NanumSquareR.LICENSE.txt
          test -s build/web/Galmuri-OFL.txt

      - name: Validate exported pack runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_log="$(mktemp)"
          # Do not let missing packed resources fall back to checkout files.
          # The deployed browser has the PCK only, not our source tree.
          pack_check_dir="$(mktemp -d)"
          cd "$pack_check_dir"
          "$GITHUB_WORKSPACE/godot" --headless --main-pack "$GITHUB_WORKSPACE/build/web/index.pck" --quit-after 5 2>&1 | tee "$runtime_log"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script' "$runtime_log"; then
            echo "Exported Web pack contains a runtime script error" >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
