name: Test and deploy expedition
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      full_checks:
        description: 'Run all regression and balance suites'
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  GODOT_VERSION: 4.6.2
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache Godot and Web template
        id: godot-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/ss-godot/bin
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: ${{ runner.os }}-ss-godot-web-${{ env.GODOT_VERSION }}-v1
      - name: Install Godot and Web template
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 6 --retry-all-errors --retry-delay 10 --connect-timeout 30 --max-time 300 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mkdir -p "$HOME/.cache/ss-godot/bin"
          unzip -p /tmp/godot.zip "Godot_v${GODOT_VERSION}-stable_linux.x86_64" > "$HOME/.cache/ss-godot/bin/godot"
          chmod +x "$HOME/.cache/ss-godot/bin/godot"
          curl -L --fail --retry 6 --retry-all-errors --retry-delay 10 --connect-timeout 30 --max-time 300 -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -j -q /tmp/templates.tpz templates/web_nothreads_release.zip templates/version.txt -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
      - name: Use cached Godot
        run: echo "$HOME/.cache/ss-godot/bin" >> "$GITHUB_PATH"
      - name: Import resources
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import --quit 2>&1 | tee /tmp/import.log
          ! grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/import.log
      - name: Run selected checks
        timeout-minutes: 20
        shell: bash
        env:
          FULL_CHECKS: ${{ inputs.full_checks || false }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$FULL_CHECKS" == "true" ]]; then
            python3 tools/ci/select_suites.py --full > /tmp/suites.txt
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            python3 tools/ci/select_suites.py --before "$BEFORE_SHA" > /tmp/suites.txt
          else
            python3 tools/ci/select_suites.py > /tmp/suites.txt
          fi
          echo "Selected checks: $(cat /tmp/suites.txt)"
          for suite in $(cat /tmp/suites.txt); do
            echo "::group::$suite"
            godot --headless --path . --script "res://tests/${suite}.gd" 2>&1 | tee "/tmp/${suite}.log"
            ! grep -E 'SCRIPT ERROR:|^ERROR:' "/tmp/${suite}.log"
            echo "::endgroup::"
          done
      - name: Export and verify packed runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee /tmp/export.log
          ! grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/export.log
          cp assets/fonts/NanumSquareR.LICENSE.txt build/web/
          cp assets/fonts/Galmuri11.LICENSE.txt build/web/
          touch build/web/.nojekyll
          pack_check_dir="$(mktemp -d)"
          cd "$pack_check_dir"
          godot --headless --main-pack "$GITHUB_WORKSPACE/build/web/index.pck" --quit-after 5 2>&1 | tee /tmp/pack.log
          ! grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/pack.log
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
